<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1c1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>🎖️ Hex Wargame 1944 — 2.5D Taktiksel Savaş</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 2.5D Canvas -->
  <div id="game-container">
    <canvas id="hexCanvas"></canvas>
  </div>

  <!-- Üst Bar: Tur Bilgisi & İstatistikler -->
  <header id="top-bar">
    <div class="header-left">
      <span class="badge faction-badge" id="player-faction">MÜTTEFİKLER</span>
      <span class="turn-indicator" id="turn-text">TUR: 1 / 25</span>
    </div>
    <div class="header-center" id="phase-banner">OYUNCU FAZI</div>
    <div class="header-right">
      <button id="zoom-in" class="ctrl-btn" title="Yakınlaş">+</button>
      <button id="zoom-out" class="ctrl-btn" title="Uzaklaş">-</button>
      <button id="center-cam" class="ctrl-btn" title="Merkeze Dön">🎯</button>
    </div>
  </header>

  <!-- Alt Bar: Seçili Birim Kartı & Aksiyonlar -->
  <footer id="bottom-bar">
    <div id="unit-card" class="unit-card empty">
      <div class="unit-header">
        <span id="unit-name">Bir Birlik Seçin</span>
        <span id="unit-category" class="tag">-</span>
      </div>
      <div class="unit-stats-grid">
        <div class="stat-item"><span class="lbl">Can</span><span id="unit-hp" class="val">--/10</span></div>
        <div class="stat-item"><span class="lbl">Hareket</span><span id="unit-mp" class="val">--</span></div>
        <div class="stat-item"><span class="lbl">Mühimmat</span><span id="unit-ammo" class="val">--</span></div>
        <div class="stat-item"><span class="lbl">Yakıt</span><span id="unit-fuel" class="val">--</span></div>
        <div class="stat-item"><span class="lbl">Delme</span><span id="unit-pen" class="val">-- mm</span></div>
        <div class="stat-item"><span class="lbl">Ön Zırh</span><span id="unit-armor" class="val">-- mm</span></div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="btn-digin" class="action-btn" disabled>🛡️ Siper Kaz</button>
      <button id="btn-endturn" class="action-btn primary">⏳ Turu Bitir</button>
    </div>
  </footer>

  <!-- Çatışma Raporu Modalı -->
  <div id="combat-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="combat-title">💥 Muharebe Raporu</h3>
      <div class="combat-body">
        <div id="combat-details"></div>
      </div>
      <button id="modal-close" class="modal-btn">Tamam</button>
    </div>
  </div>

  <!-- Bildirim Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="game.js"></script>
</body>
</html>
