name: 🚀 Unity Android Otomatik APK Derleyici (GameCI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  buildForAndroid:
    name: Android APK Derle (Unity 2022.3)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unity Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Android APK Derle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: HexWargameWW2
          buildsPath: build/Android
          androidExportType: androidPackage # Doğrudan .apk üretir
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: APK Dosyasını Yükle (Downloadable Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: HexWargameWW2-Android-APK
          path: build/Android/HexWargameWW2.apk
          retention-days: 14
